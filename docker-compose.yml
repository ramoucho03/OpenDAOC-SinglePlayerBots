networks:
  opendaoc-network:
    driver: bridge

volumes:
  # MariaDB on-disk data. Persist across `docker compose down`; nuke with
  # `docker compose down -v` if you want to reset the world to factory.
  opendaoc-db-data:
  # Shared between db-seed (writer) and db (reader): the seed sidecar drops
  # combined.sql here, MariaDB's initdb picks it up on first launch.
  base-db:

services:
  # ---------------------------------------------------------------------------
  # db-seed
  #
  # One-shot sidecar. Reuses the gameserver image (which embeds combined.sql
  # at /tmp/opendaoc-db/) and copies that SQL into the shared `base-db`
  # volume, then exits 0. The `db` service waits for this with
  # `service_completed_successfully` so MariaDB's initdb directory is
  # guaranteed populated before MariaDB ever touches it.
  #
  # Without this sidecar the original compose had a race: depends_on: db
  # forced the gameserver to wait for the DB, but the DB's first-run init
  # needed the SQL the gameserver had not yet written. The DB would come up
  # with an empty schema and the server crashed on first query.
  # ---------------------------------------------------------------------------
  db-seed:
    image: opendaoc-fork:latest
    container_name: opendaoc-db-seed
    build:
      # Same context as the gameserver so docker compose tags the same image
      # for both services and only builds once.
      # Replace `#master` with another branch (e.g. `#claude/optimize-dol-server-gho1T`)
      # to test a feature branch end-to-end without merging.
      context: https://github.com/ramoucho03/OpenDAOC-SinglePlayerBots.git#master
    entrypoint: ["/bin/sh", "-c"]
    # Idempotent seed: the test-then-copy form is portable across GNU
    # coreutils (Debian/Ubuntu) and BusyBox (Alpine) — `cp -n` was a
    # GNU-ism not supported by every BusyBox version we might land on.
    command: "if [ ! -f /seed/combined.sql ]; then cp /tmp/opendaoc-db/combined.sql /seed/combined.sql; fi && echo 'db-seed: schema ready in shared volume' && ls -lh /seed"
    volumes:
      - base-db:/seed
    networks:
      - opendaoc-network
    restart: "no"

  # ---------------------------------------------------------------------------
  # db — MariaDB 10.6
  #
  # The healthcheck is the gate the gameserver waits on. Without it the
  # gameserver can race the DB's first-launch initialisation and crash
  # on its first connection attempt (the `restart: unless-stopped` would
  # cover it, but the first 30s of logs would be confusing).
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:10.6
    container_name: opendaoc-db
    stdin_open: true
    tty: true
    command: --default-authentication-plugin=mysql_native_password --lower_case_table_names=1 --character-set-server=utf8mb3 --collation-server=utf8mb3_general_ci --innodb_large_prefix=1 --innodb_file_format=Barracuda --innodb_file_per_table=1
    restart: always
    environment:
      MYSQL_DATABASE: opendaoc
      MYSQL_ROOT_PASSWORD: my-secret-pw
    volumes:
      - opendaoc-db-data:/var/lib/mysql
      - base-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pmy-secret-pw"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      db-seed:
        condition: service_completed_successfully
    networks:
      - opendaoc-network

  # ---------------------------------------------------------------------------
  # gameserver
  #
  # Build context same as db-seed so a single image build covers both.
  # `depends_on` waits on the DB being healthy, not just started, so the
  # first dotnet log line you see is from a server that successfully opened
  # the DB connection — not an exception trace.
  # ---------------------------------------------------------------------------
  gameserver:
    image: opendaoc-fork:latest
    container_name: opendaoc-server
    build:
      # Replace `#master` with the branch you want to test:
      #   context: https://github.com/ramoucho03/OpenDAOC-SinglePlayerBots.git#claude/optimize-dol-server-gho1T
      # For uncommitted local changes use `context: .` (and remove the URL).
      context: https://github.com/ramoucho03/OpenDAOC-SinglePlayerBots.git#master
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "10300:10300"
      - "10400:10400/udp"
    depends_on:
      db:
        condition: service_healthy
    environment:
      UID: "1000"
      GID: "1000"
      AUTO_ACCOUNT_CREATION: "True"
      CHEAT_LOGGER_NAME: "cheats"
      CPU_USE: "8"
      DB_AUTOSAVE: "True"
      DB_AUTOSAVE_INTERVAL: "10"
      DB_CONNECTION_STRING: "server=db;port=3306;database=opendaoc;userid=root;password=my-secret-pw;treattinyasboolean=true"
      DB_TYPE: "MYSQL"
      DETECT_REGION_IP: "True"
      ENABLE_COMPILATION: "True"
      ENABLE_UPNP: "False"
      GAME_TYPE: "Normal"
      GM_ACTION_LOGGER_NAME: "gmactions"
      INVALID_NAMES_FILE: "./config/invalidnames.txt"
      LOG_CONFIG_FILE: "./config/logconfig.xml"
      REGION_IP: "0.0.0.0"
      REGION_PORT: "10400"
      SCRIPT_ASSEMBLIES: ""
      SCRIPT_COMPILATION_TARGET: "./lib/GameServerScripts.dll"
      SERVER_IP: "0.0.0.0"
      SERVER_NAME: "OpenDAoC"
      SERVER_NAME_SHORT: "OPENDAOC"
      SERVER_PORT: "10300"
      UDP_IP: "0.0.0.0"
      UDP_PORT: "10400"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "False"
      # ----- .NET runtime performance tuning -----
      # ServerGC + concurrent + heap-per-cpu => parallel collections without long pauses.
      # Necessary for the high-allocation game loop with hundreds of bots.
      DOTNET_gcServer: "1"
      DOTNET_gcConcurrent: "1"
      DOTNET_GCRetainVM: "1"
      # Tiered PGO lets the JIT recompile hot paths with full optimisation after warmup.
      DOTNET_TieredCompilation: "1"
      DOTNET_TieredPGO: "1"
      DOTNET_ReadyToRun: "1"
      # Pre-allocate worker threads so the pool doesn't slow-start under burst load
      # (login waves, big group encounters, etc.). Tune these to your VM cores.
      DOTNET_ThreadPool_ForceMinWorkerThreads: "32"
      DOTNET_ThreadPool_ForceMaxWorkerThreads: "256"
      # Bot AI scaling — see ServerProperty pvp_frontier_population_per_realm too.
      # The game loop runs at 30 TPS by default (game_loop_tick_rate ServerProperty).
    networks:
      - opendaoc-network
