networks:
  opendaoc-network:
    driver: bridge

volumes:
  opendaoc-db-data:
  base-db:

services:
  db:
    # 11.4 = LTS. Doit être >= 10.10 pour la collation utf8mb4_uca1400_ai_ci
    # utilisée par le dump upstream OpenDAoC-Database.
    image: mariadb:11.4
    container_name: opendaoc-db
    stdin_open: true
    tty: true
    command:
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
      - --character-set-server=utf8mb3
      - --collation-server=utf8mb3_general_ci
      - --innodb_large_prefix=1
      - --innodb_file_format=Barracuda
      - --innodb_file_per_table=1
      # --- Performance InnoDB : ajustez innodb_buffer_pool_size a 50-70% de
      # la RAM dediee a la DB. 2G met deja toute la base (~70 Mo) en cache.
      - --innodb_buffer_pool_size=2G
      - --innodb_log_file_size=512M
      - --innodb_flush_method=O_DIRECT
      - --max_connections=200
      # flush_log_at_trx_commit=2 : supprime le fsync disque a chaque commit
      # (cause directe des INSERT/DELETE Inventory a 100+ ms). Le redo log est
      # flushe 1x/s -> au pire 1s de transactions perdues sur crash OS/courant
      # (jamais sur crash du serveur de jeu). Negligeable : l'autosave tourne
      # deja toutes les 10 min.
      - --innodb_flush_log_at_trx_commit=2
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: opendaoc
      MYSQL_ROOT_PASSWORD: my-secret-pw
    volumes:
      - opendaoc-db-data:/var/lib/mysql
      - base-db:/docker-entrypoint-initdb.d
    networks:
      - opendaoc-network
    healthcheck:
      # MariaDB stays "starting" until the init scripts in
      # /docker-entrypoint-initdb.d have run and the server accepts queries.
      # We probe with a real query so the gameserver only starts when the
      # 70MB combined.sql import is fully applied.
      test: ["CMD-SHELL", "mariadb -uroot -pmy-secret-pw -e 'SELECT 1' opendaoc"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  gameserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: opendaoc-singleplayerbots:local
    container_name: opendaoc-server
    stdin_open: true
    tty: true
    ports:
      - "10300:10300"
      - "10400:10400"
    depends_on:
      db:
        condition: service_healthy
    environment:
      UID: "1000"
      GID: "1000"
      AUTO_ACCOUNT_CREATION: "True"
      CHEAT_LOGGER_NAME: "cheats"
      CPU_USE: "8"
      DB_AUTOSAVE: "True"
      DB_AUTOSAVE_INTERVAL: "10"
      DB_CONNECTION_STRING: "server=db;port=3306;database=opendaoc;userid=root;password=my-secret-pw;treattinyasboolean=true"
      DB_TYPE: "MYSQL"
      DETECT_REGION_IP: "True"
      ENABLE_COMPILATION: "True"
      ENABLE_UPNP: "False"
      GAME_TYPE: "Normal"
      GM_ACTION_LOGGER_NAME: "gmactions"
      INVALID_NAMES_FILE: "./config/invalidnames.txt"
      LOG_CONFIG_FILE: "./config/logconfig.xml"
      REGION_IP: "0.0.0.0"
      REGION_PORT: "10400"
      SCRIPT_ASSEMBLIES: ""
      SCRIPT_COMPILATION_TARGET: "./lib/GameServerScripts.dll"
      SERVER_IP: "0.0.0.0"
      SERVER_NAME: "OpenDAoC"
      SERVER_NAME_SHORT: "OPENDAOC"
      SERVER_PORT: "10300"
      UDP_IP: "0.0.0.0"
      UDP_PORT: "10400"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "False"
      # --- Performance GC : consommer plus de RAM pour supprimer les pauses ---
      DOTNET_gcServer: "1"                  # Server GC (1 heap par coeur)
      DOTNET_gcConcurrent: "1"              # Background GC (gen2 non bloquant)
      DOTNET_GCDynamicAdaptationMode: "0"   # Desactive DATAS -> heaps max en permanence
      DOTNET_GCRetainVM: "1"                # Reutilise les segments liberes
      DOTNET_GCgen0size: "0xC000000"        # Gen0 ~192 Mo/heap x12 coeurs = ~2.3 Go, bien moins de collectes
    volumes:
      - base-db:/tmp/opendaoc-db
    networks:
      - opendaoc-network
