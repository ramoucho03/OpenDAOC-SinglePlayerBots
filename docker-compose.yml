networks:
  opendaoc-network:
    driver: bridge

volumes:
  # MariaDB on-disk data. Persist across `docker compose down`; nuke with
  # `docker compose down -v` if you want to reset the world to factory.
  opendaoc-db-data:
  # Shared between db-seed (writer) and db (reader): the seed sidecar drops
  # combined.sql here, MariaDB's initdb picks it up on first launch.
  base-db:

services:
  # ---------------------------------------------------------------------------
  # db-seed
  #
  # One-shot sidecar. Reuses the gameserver image (which embeds combined.sql
  # at /tmp/opendaoc-db/) and copies that SQL into the shared `base-db`
  # volume, then exits 0. The `db` service waits for this with
  # `service_completed_successfully` so MariaDB's initdb directory is
  # guaranteed populated before MariaDB ever touches it.
  #
  # Without this sidecar the original compose had a race: depends_on: db
  # forced the gameserver to wait for the DB, but the DB's first-run init
  # needed the SQL the gameserver had not yet written. The DB would come up
  # with an empty schema and the server crashed on first query.
  # ---------------------------------------------------------------------------
  db-seed:
    image: opendaoc-fork:latest
    container_name: opendaoc-db-seed
    build:
      # Local context: builds from the working tree so uncommitted changes
      # (Dockerfile tweaks, native lib build, code fixes) land in the image
      # without needing to push first. Swap to the GitHub URL form to pull
      # straight from a branch:
      #   context: https://github.com/ramoucho03/OpenDAOC-SinglePlayerBots.git#master
      context: .
    # Idempotent seed: the test-then-copy form is portable across GNU
    # coreutils (Debian/Ubuntu) and BusyBox (Alpine) — `cp -n` was a
    # GNU-ism not supported by every BusyBox version we might land on.
    # Using the array+heredoc form so YAML never collapses the if/then
    # control flow into a single broken line (which crashed with
    # `syntax error: unexpected end of file (expecting "then")` on some
    # Compose versions when the inline string got re-quoted on its way to sh).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /seed/combined.sql ]; then
          cp /tmp/opendaoc-db/combined.sql /seed/combined.sql
        fi
        echo "db-seed: schema ready in shared volume"
        ls -lh /seed
    volumes:
      - base-db:/seed
    networks:
      - opendaoc-network
    restart: "no"

  # ---------------------------------------------------------------------------
  # db — MariaDB 10.6
  #
  # The healthcheck is the gate the gameserver waits on. Without it the
  # gameserver can race the DB's first-launch initialisation and crash
  # on its first connection attempt (the `restart: unless-stopped` would
  # cover it, but the first 30s of logs would be confusing).
  # ---------------------------------------------------------------------------
  db:
    # Pinned to 12.x (was 10.6) because the volume on disk was created by a
    # newer mariadb image and the InnoDB redo log can't be downgraded: starting
    # 10.6 against that volume aborts with
    # `Unsupported redo log format. The redo log was created with MariaDB 12.2.2`.
    # If you ever want to reset to a clean 10.6, nuke the volume first:
    #   docker compose down -v   # (DESTROYS THE DB)
    image: mariadb:12
    container_name: opendaoc-db
    stdin_open: true
    tty: true
    # Tuning for a 12-24 GB / 12 vCPU host.
    # - innodb_buffer_pool_size: 2G fully caches the whole OpenDAOC DB (~200 MB
    #   total) plus headroom for growth, so reads never hit disk after warmup.
    # - innodb_buffer_pool_instances: 4 splits the pool to reduce mutex
    #   contention when many threads read/write concurrently (login waves,
    #   100+ Mimic bots ticking every frame).
    # - innodb_log_file_size: 256M lets InnoDB batch many writes between
    #   checkpoints, slashing per-INSERT latency on the game-loop workload.
    # - innodb_log_buffer_size: 32M absorbs large transactions in RAM before
    #   they ever touch the log file.
    # - innodb_flush_log_at_trx_commit=2: fsync once per second instead of
    #   per commit. You can lose ~1s of writes if the container is yanked,
    #   which is acceptable for a game server (autosave runs every 10 min).
    # - innodb_flush_method=O_DIRECT: bypass OS page cache, avoids double
    #   buffering that wastes RAM.
    # - innodb_io_capacity=2000 / max=4000: assume SSD. Drop both 10× on HDD.
    # - innodb_read/write_io_threads=8: scale background I/O with 12 vCPU.
    # - innodb_purge_threads=4: parallelise the undo-log cleanup so it
    #   doesn't pile up under churn (Mimic loot pickups, drops).
    # - max_connections=500: lots of headroom for the gameserver's MinPool=30
    #   plus the 100+ Mimic threads grabbing pooled connections.
    # - table_open_cache=4000 / thread_cache_size=100: avoid file-open and
    #   thread-create overhead on bursty workloads.
    command: >-
      --default-authentication-plugin=mysql_native_password
      --lower_case_table_names=1
      --character-set-server=utf8mb3
      --collation-server=utf8mb3_general_ci
      --innodb_large_prefix=1
      --innodb_file_format=Barracuda
      --innodb_file_per_table=1
      --innodb_buffer_pool_size=2G
      --innodb_buffer_pool_instances=4
      --innodb_log_file_size=256M
      --innodb_log_buffer_size=32M
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --innodb_io_capacity=2000
      --innodb_io_capacity_max=4000
      --innodb_read_io_threads=8
      --innodb_write_io_threads=8
      --innodb_purge_threads=4
      --max_connections=500
      --table_open_cache=4000
      --thread_cache_size=100
      --tmp_table_size=128M
      --max_heap_table_size=128M
    restart: always
    environment:
      MYSQL_DATABASE: opendaoc
      MYSQL_ROOT_PASSWORD: my-secret-pw
    volumes:
      - opendaoc-db-data:/var/lib/mysql
      - base-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pmy-secret-pw"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      db-seed:
        condition: service_completed_successfully
    networks:
      - opendaoc-network

  # ---------------------------------------------------------------------------
  # gameserver
  #
  # Build context same as db-seed so a single image build covers both.
  # `depends_on` waits on the DB being healthy, not just started, so the
  # first dotnet log line you see is from a server that successfully opened
  # the DB connection — not an exception trace.
  # ---------------------------------------------------------------------------
  gameserver:
    image: opendaoc-fork:latest
    container_name: opendaoc-server
    build:
      # Local context: builds from the working tree so uncommitted changes
      # land in the image without a push. Swap to the GitHub URL form to
      # build a remote branch:
      #   context: https://github.com/ramoucho03/OpenDAOC-SinglePlayerBots.git#claude/optimize-dol-server-gho1T
      context: .
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "10300:10300"
      - "10400:10400/udp"
    depends_on:
      db:
        condition: service_healthy
    environment:
      UID: "1000"
      GID: "1000"
      AUTO_ACCOUNT_CREATION: "True"
      CHEAT_LOGGER_NAME: "cheats"
      CPU_USE: "12"
      DB_AUTOSAVE: "True"
      DB_AUTOSAVE_INTERVAL: "10"
      DB_CONNECTION_STRING: "server=db;port=3306;database=opendaoc;userid=root;password=my-secret-pw;treattinyasboolean=true"
      DB_TYPE: "MYSQL"
      DETECT_REGION_IP: "True"
      ENABLE_COMPILATION: "True"
      ENABLE_UPNP: "False"
      GAME_TYPE: "Normal"
      GM_ACTION_LOGGER_NAME: "gmactions"
      INVALID_NAMES_FILE: "./config/invalidnames.txt"
      LOG_CONFIG_FILE: "./config/logconfig.xml"
      REGION_IP: "0.0.0.0"
      REGION_PORT: "10400"
      SCRIPT_ASSEMBLIES: ""
      SCRIPT_COMPILATION_TARGET: "./lib/GameServerScripts.dll"
      SERVER_IP: "0.0.0.0"
      SERVER_NAME: "OpenDAoC"
      SERVER_NAME_SHORT: "OPENDAOC"
      SERVER_PORT: "10300"
      UDP_IP: "0.0.0.0"
      UDP_PORT: "10400"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "False"
      # ----- .NET runtime performance tuning -----
      # ServerGC + concurrent + heap-per-cpu => parallel collections without long pauses.
      # Necessary for the high-allocation game loop with hundreds of bots.
      DOTNET_gcServer: "1"
      DOTNET_gcConcurrent: "1"
      DOTNET_GCRetainVM: "1"
      # Tiered PGO lets the JIT recompile hot paths with full optimisation after warmup.
      DOTNET_TieredCompilation: "1"
      DOTNET_TieredPGO: "1"
      DOTNET_ReadyToRun: "1"
      # Pre-allocate worker threads so the pool doesn't slow-start under burst load
      # (login waves, big group encounters, etc.). Tuned for a 12 vCPU host:
      # 64 = ~5× vCPU for the always-warm pool, 512 absorbs Mimic AI bursts.
      DOTNET_ThreadPool_ForceMinWorkerThreads: "64"
      DOTNET_ThreadPool_ForceMaxWorkerThreads: "512"
      # I/O completion pool gets the same treatment so socket sends don't queue
      # behind the worker pool on login waves.
      DOTNET_ThreadPool_ForceMinIOCompletionThreads: "64"
      DOTNET_ThreadPool_ForceMaxIOCompletionThreads: "512"
      # Server GC heap-per-CPU: 12 parallel heaps = ~12× faster GC pauses for
      # the high-allocation game loop. Implicit with gcServer=1 already, but
      # making it explicit documents the topology. Don't pin to specific cores
      # (GCHeapAffinitizeRanges) — Docker's cgroup scheduler manages CPU
      # placement and pinning can fight it.
      DOTNET_GCHeapCount: "12"
      # Bot AI scaling — see ServerProperty pvp_frontier_population_per_realm too.
      # The game loop runs at 30 TPS by default (game_loop_tick_rate ServerProperty).
    networks:
      - opendaoc-network
